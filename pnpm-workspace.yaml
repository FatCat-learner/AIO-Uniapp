minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@vitejs/plugin-legacy@5.3.2'
  - semver@6.3.1
  - undici-types

shellEmulator: true

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@uni-helper/unocss-preset-uni': true
  core-js: true
  core-js-pure: true
  esbuild: true
  less: false
  protobufjs: false
  simple-git-hooks: true
