minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@vitejs/plugin-legacy@5.3.2'
  - semver@6.3.1
  - undici-types

autoInstallPeers: true
shellEmulator: true

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@uni-helper/unocss-preset-uni': true
  core-js: true
  core-js-pure: true
  esbuild: true
  less: false
  protobufjs: false
  simple-git-hooks: true

# 从 package.json 的 pnpm.overrides 迁移而来（pnpm 12 不再读 package.json 里的 pnpm 字段）
overrides:
  vue: 3.4.21
